
server_name: trams-local

host: 0.0.0.0
port: 4222

http_port: 8222

jetstream {
  store_dir: /data/jetstream
  max_memory_store: 64MB
  max_file_store: 1GB
}

authorization {
  users = [
    {
      # API Gateway
      user: $GATEWAY_NATS_USER
      password: $GATEWAY_NATS_PASSWORD
      permissions: {
        publish: [
          "user.rpc.create",
          "user.rpc.authenticate",
          "user.rpc.get-by-id",
          "user.rpc.update",
        ]
        subscribe: ["_INBOX.>"]
      }
    },
    {
      # User Service 
      user: $USER_SERVICE_NATS_USER
      password: $USER_SERVICE_NATS_PASSWORD
      permissions: {
        publish: {
          allow: ["user.created", "$JS.API.>"]
        }
        subscribe: [
          "user.rpc.create",
          "user.rpc.authenticate",
          "user.rpc.get-by-id",
          "user.rpc.update",
          "_INBOX.>",
        ]
        allow_responses: true
      }
    },
    {
      # Notification Service
      user: $NOTIFICATION_SERVICE_NATS_USER
      password: $NOTIFICATION_SERVICE_NATS_PASSWORD
      permissions: {
        publish: ["$JS.API.>", "$JS.ACK.>", "user.events.dlq"]
        subscribe: ["_INBOX.>"]
      }
    },
  ]
}
